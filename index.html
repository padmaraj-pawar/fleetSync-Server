<!DOCTYPE html>
<html>
<head>
    <title>Tempo Live Map</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; }
        #map-box { width: 400px; height: 400px; border: 2px solid #4CAF50; margin: 20px auto; position: relative; background: #222; }
        #truck { width: 20px; height: 20px; background: red; position: absolute; border-radius: 50%; transition: all 0.5s; }
    </style>
</head>
<body>
    <h1>Live Fleet Movement</h1>
    <div id="status">Connecting to WebSocket...</div>
    <div id="map-box">
        <div id="truck"></div>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.hostname || '127.0.0.1'}:8000/dashboard/map/ws`);
        const truck = document.getElementById("truck");
        const status = document.getElementById("status");

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            status.innerText = `Tracking: ${data.tempo_id} | Lat: ${data.lat} | Lon: ${data.lon}`;
            
            // Move the red dot based on coordinates
            truck.style.left = (data.lon % 100) * 4 + "px"; 
            truck.style.top = (data.lat % 100) * 4 + "px";
        };

        ws.onopen = () => status.innerText = "Connected! Waiting for data...";
        ws.onerror = () => status.innerText = "Error: Is the server running?";
    </script>
</body>
</html>
